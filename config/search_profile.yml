# PERSONALIZE THIS FILE BEFORE TRUSTING THE RANKINGS.
# The collector/company infrastructure is reusable; this file is the user-specific layer.
profile_name: "Microbiology & Genomics Postdoc/Junior Scientist"
profile_status: "personalized_active"

# Helpful context for ChatGPT. These fields are descriptive; the scorer ignores them.
target_summary: >-
  Doctoral researcher in Microbiology with dual expertise in computational biology (comparative genomics, Python/R) and wet-lab techniques (fermentation, GC-MS, cell assays). Targeting Postdoc or Junior Scientist roles in academia or biotech, specifically focused on probiotics, microbiome, fermentation, or bioinformatics.
resume_strengths: 
  - "Comparative Genomics & Pan-genome analysis"
  - "Bioinformatics (Python, R, Linux)"
  - "Probiotics Evaluation & Fermentation"
  - "Analytical & Molecular Lab Techniques (GC-MS, HPLC, PCR)"
target_titles: ["Postdoc", "Postdoctoral", "Scientist", "Junior Scientist", "Researcher", "Bioinformatician"]
avoid_titles: ["Director", "Principal", "Head", "VP", "Manager", "Senior Scientist"]
preferred_locations: ["Finland", "Europe", "Remote"]
compensation_notes: "Standard Postdoc/Junior Scientist academic or industry bands"

score_bands:
  exceptional: 85
  strong: 75
  review: 65

# First matching rule wins. Patterns are regular expressions, case-insensitive.
role_rules:
  - name: core_microbiology_genomics
    score: 30
    patterns:
      - "postdoc.*microbiolog"
      - "scientist.*microbiolog"
      - "comparative genomic"
      - "probiotic"
      - "fermentation scientist"
  - name: core_bioinformatics_computational
    score: 27
    patterns:
      - "bioinformatic"
      - "computational biolog"
      - "computational genomic"
  - name: generic_postdoc
    score: 20
    patterns:
      - "postdoctoral"
      - "postdoc"
      - "fellowship"
  - name: junior_scientist
    score: 18
    patterns:
      - "junior scientist"
      - "research scientist"
      - "researcher"
  - name: fallback_scientist
    score: 5
    patterns:
      - "scientist"
  - name: default
    score: 2
    patterns: [".*"]

# Additive categories, capped by the scorer. Customize weights to reflect your actual strengths.
domain_rules:
  - name: probiotics_microbiome
    weight: 10
    patterns: ["probiotic", "microbiome", "lactic acid bacteria", "lactobacillus", "lacticaseibacillus", "gut health"]
  - name: genomics_bioinformatics
    weight: 9
    patterns: ["genom", "pan-genome", "whole[- ]genome", "sequence analysis", "functional annotation"]
  - name: fermentation_brewing
    weight: 8
    patterns: ["fermentation", "brewing", "bioprocess", "strain characterization", "yeast", "sour beer"]
  - name: molecular_biology
    weight: 6
    patterns: ["mutagenesis", "pcr", "homologous recombination", "western blot", "qpcr", "cell culture"]

technical_rules:
  - {name: programming, weight: 5, patterns: ["python", "\\br\\b", "linux", "bash"]}
  - {name: analytical_chemistry, weight: 4, patterns: ["gc-ms", "hplc", "analytical chemistry", "chromatography"]}
  - {name: in_vitro_assays, weight: 4, patterns: ["in vitro", "cell adhesion", "flow cytometry", "cck-8", "immunofluorescence"]}
  - {name: data_science, weight: 3, patterns: ["data science", "data analysis", "statistical"]}

operating_model_rules:
  - {name: dry_wet_lab_combo, weight: 4, patterns: ["wet[- ]lab", "dry[- ]lab", "experimental", "in vitro", "multidisciplinary"]}
  - {name: industry_collaboration, weight: 3, patterns: ["pilot[- ]scale", "industry partner", "scale[- ]up", "brewery"]}
  - {name: product_development, weight: 3, patterns: ["product formulation", "sensory", "commercializ", "flavor profile"]}
  - {name: lab_management, weight: 2, patterns: ["lab management", "cell bank", "procurement"]}

leadership_rules:
  - {name: mentoring, weight: 3, patterns: ["mentor", "supervis", "guide.*students"]}
  - {name: project_management, weight: 3, patterns: ["project management", "coordinate"]}

# Adjust these after reviewing your resume and career goals.
seniority_rules:
  - {name: executive, adjustment: -50, patterns: ["vice president", "\\bvp\\b", "executive director", "chief ", "head of"]}
  - {name: director, adjustment: -30, patterns: ["associate director", "\\bdirector\\b"]}
  - {name: senior, adjustment: -15, patterns: ["senior scientist", "principal scientist", "staff scientist"]}

penalty_rules:
  - name: engineering_mismatch
    adjustment: -20
    title_patterns: ["software engineer", "data engineer", "devops", "site reliability", "computer vision"]
  - name: clinical_medical
    adjustment: -15
    title_patterns: ["medical doctor", "physician", "clinical trial manager", "regulatory affairs"]

# Interaction bonuses are optional. Use them only after calibration demonstrates a distinctive niche.
interaction_rules: []
