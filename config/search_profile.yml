profile_name: Microbiology & Genomics Postdoc/Junior Scientist
profile_status: personalized_ready
target_summary: Doctoral researcher in Microbiology with dual expertise in computational
  biology (comparative genomics, Python/R) and wet-lab techniques (precision fermentation,
  food or beverage development, GC-MS, HPLC). Targeting Postdoc or Junior Scientist
  roles in academia or biotech, specifically focused on synthetic biology,  probiotics,
  microbiome, fermentation, or bioinformatics.
resume_strengths:
- Comparative Genomics & Pan-genome analysis
- Bioinformatics (Python, R, Linux)
- Probiotics Evaluation & Fermentation
- Functional beverage
- Food development
- Analytical & Molecular Lab Techniques (GC-MS, HPLC, Western Blot, PCR, immunofluorescence)
target_titles:
- Postdoc
- Postdoctoral
- Scientist
- Junior Scientist
- Researcher
avoid_titles:
- Director
- Principal
- Head
- VP
- Manager
- Senior Scientist
