  - url: https://exactsciences.wd1.myworkdayjobs.com/en-US/Exact_Sciences/job/US---CA---San-Diego/Bioinformatics-Scientist_R26-13249
    title: Bioinformatics Scientist
    location: US - CA - San Diego
    description: Bioinformatics technical lead in Research and Development translating
      research into diagnostic assay products; next-generation sequencing (NGS) and
      genomics, Linux-based HPC and cloud computing, custom code in multiple programming
      or scripting languages, statistical analysis including R, product development,
      validation, experimental design, cross-functional collaboration and technical
      leadership. Oncology diagnostics context; bioinformatics pipeline development
      and project lead responsibilities.
  - url: https://exactsciences.wd1.myworkdayjobs.com/en-US/Exact_Sciences/job/Sr-Bioinformatics-Scientist_R26-13229
    title: Sr. Bioinformatics Scientist
    location: US - CA - San Diego
    description: Senior bioinformatics technical lead and subject matter expert for
      complex Research and Development projects and diagnostic assay product development;
      NGS and genomics, variant calling, algorithm development, bioinformatics pipelines
      including Nextflow, AWS/cloud computing, statistical and quantitative methods,
      product development, cross-functional leadership and mentoring of junior scientists.
  - url: https://exactsciences.wd1.myworkdayjobs.com/Exact_Sciences/job/US---CA---San-Diego/Principal-Bioinformatics-Scientist_R26-13421
    title: Principal Bioinformatics Scientist
    location: US - CA - San Diego
    description: Principal bioinformatics thought leader and subject matter expert
      for molecular diagnostics product development; bioinformatics, genomics and
      next-generation sequencing (NGS), independent algorithm development, complex
      data analysis, liquid biopsy NGS, statistical methods, product and assay development,
      software development lifecycle familiarity, cross-functional technical leadership
      and mentoring.
  - url: https://exactsciences.wd1.myworkdayjobs.com/en-US/Exact_Sciences/job/Staff-Bioinformatics---Machine-Learning-Scientist_R26-13173
    title: Staff Bioinformatics / Machine Learning Scientist
    location: US - CA - La Jolla
    description: Staff-level computational biology and bioinformatics leader developing
      machine learning, statistical models and bioinformatics algorithms for next-generation
      sequencing (NGS) and genomics products; reproducible analysis workflows, cloud
      computing, assay development, analytical performance evaluation, quality control,
      validation, sensitivity and specificity, product development, cross-functional
      leadership and mentoring.
  enabled: true
